<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>God of War RPG — Tim Wu</title>
  <meta name="description" content="A turn-based battle game built with vanilla JavaScript. Modernized from a 2018 jQuery bootcamp project.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arena">
    <header class="game-header">
      <h1>God of War <span>RPG</span></h1>
      <p class="tagline">Choose your god. Defeat all three enemies.</p>
    </header>

    <!-- Roster: pick your god, then pick enemies -->
    <section id="roster-section">
      <h2 id="roster-prompt">Choose your god</h2>
      <div id="roster" class="card-row"></div>
    </section>

    <!-- Battle arena: KOF-style stage -->
    <section id="battle-section" class="hidden">
      <div class="hud">
        <div class="hud-side">
          <div class="hud-name" id="player-name"></div>
          <div class="hp-bar kof">
            <div class="hp-ghost" id="player-ghost"></div>
            <div class="hp-fill player" id="player-hp"></div>
            <span class="hp-num" id="player-hp-text"></span>
          </div>
        </div>
        <div class="hud-center" id="round-label">ROUND 1</div>
        <div class="hud-side">
          <div class="hud-name right" id="enemy-name"></div>
          <div class="hp-bar kof flip">
            <div class="hp-ghost" id="enemy-ghost"></div>
            <div class="hp-fill enemy" id="enemy-hp"></div>
            <span class="hp-num" id="enemy-hp-text"></span>
          </div>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="fighter-sprite player-side" id="player-sprite"><img id="player-img" alt=""></div>
        <div class="fighter-sprite enemy-side" id="enemy-sprite"><img id="enemy-img" alt=""></div>
        <div class="announce hidden" id="announce"></div>
      </div>

      <div class="controls">
        <button id="attack-btn" class="btn">⚔ Attack</button>
        <button id="restart-btn" class="btn btn-ghost hidden">↺ Play again</button>
      </div>

      <div id="log" class="log" aria-live="polite"></div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
